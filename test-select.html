<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>select-panel 视口定位测试</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      body { min-height: 100vh; }
      .test-fixed-bottom {
        position: fixed;
        bottom: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="composer">
        <div class="controls">
          <div class="control" id="ctlTop">
            <span class="control-label">画幅(顶部·空间充足·应向下)</span>
            <select id="selTop" aria-label="宽高比"></select>
          </div>
        </div>
      </section>
    </main>

    <div class="controls test-fixed-bottom">
      <div class="control" id="ctlBottom">
        <span class="control-label">画幅(底部·应向上翻)</span>
        <select id="selBottom" aria-label="宽高比"></select>
      </div>
      <div class="control" id="ctlRight">
        <span class="control-label">清晰度(右缘·应向左对齐)</span>
        <select id="selRight" aria-label="分辨率"></select>
      </div>
    </div>

    <script src="/static/common.js"></script>
    <script>
      function fill(id, opts) {
        var sel = document.getElementById(id);
        opts.forEach(function (o) {
          var opt = document.createElement("option");
          opt.value = o;
          opt.label = o;
          sel.appendChild(opt);
        });
      }
      fill("selTop", ["1:1", "3:4", "4:3", "9:16", "16:9", "2:3", "3:2"]);
      fill("selBottom", ["1:1", "3:4", "4:3", "9:16", "16:9", "2:3", "3:2"]);
      fill("selRight", ["1K", "2K", "4K"]);
      window.STImagen.enhanceAllSelects();
    </script>
  </body>
</html>
