# DigitalOcean 临时 4 vCPU / 8 GiB 资源覆盖层。
# 与 compose.prod.yml 一起使用；回到 2c2g 时停止使用本文件即可。
services:
  app:
    environment:
      # 仍保持单 worker：并发计数、限流和账号槽位是进程内状态。
      UVICORN_WORKERS: "1"
      HTTP_MAX_CONNECTIONS: "256"
      HTTP_MAX_KEEPALIVE: "256"
      GENERATED_IMAGE_DOWNLOAD_CONCURRENCY: "64"
      DB_POOL_SIZE: "8"
      DB_POOL_TIMEOUT_SECONDS: "5"
    cpus: 3.2
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 1024
    tmpfs:
      - /tmp:size=256m,mode=1777
    ulimits:
      nofile:
        soft: 16384
        hard: 16384

  nginx:
    cpus: 0.6
    mem_limit: 512m
