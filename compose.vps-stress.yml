services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: st-imagen-vps-2c2g
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      DEBUG: "false"
      # 进程内准入/故障隔离状态决定只能单 worker；压测环境与安全配置对齐
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      HTTP_MAX_CONNECTIONS: "${HTTP_MAX_CONNECTIONS:-96}"
      HTTP_MAX_KEEPALIVE: "${HTTP_MAX_KEEPALIVE:-96}"
      ACCOUNT_MAX_INFLIGHT: "${ACCOUNT_MAX_INFLIGHT:-2}"
      GENERATED_IMAGE_DOWNLOAD_CONCURRENCY: "${GENERATED_IMAGE_DOWNLOAD_CONCURRENCY:-32}"
      GENERATED_IMAGE_MIN_FREE_BYTES: "${GENERATED_IMAGE_MIN_FREE_BYTES:-8589934592}"
      # 可选：本机代理需要显式映射到宿主机；未设置时保持直连。
      HTTP_PROXY: "${VPS_HTTP_PROXY:-}"
      HTTPS_PROXY: "${VPS_HTTPS_PROXY:-}"
      NO_PROXY: "${VPS_NO_PROXY:-localhost,127.0.0.1,::1}"
      http_proxy: "${VPS_HTTP_PROXY:-}"
      https_proxy: "${VPS_HTTPS_PROXY:-}"
      no_proxy: "${VPS_NO_PROXY:-localhost,127.0.0.1,::1}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-4}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-0}"
      DB_POOL_TIMEOUT_SECONDS: "${DB_POOL_TIMEOUT_SECONDS:-3}"
      # 容器资源仿真仍使用生产的 60 槽位；仅关闭用户限速和熔断，
      # 避免压测账号身份/短时失败改变容量结论。
      GENERATION_GLOBAL_MAX_CONCURRENT: "${GENERATION_GLOBAL_MAX_CONCURRENT:-60}"
      USER_RPM_LIMIT: "0"
      CIRCUIT_BREAKER_FAILURES: "0"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18001:8001"
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
