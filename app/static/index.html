<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>st·imagen — 让想象，显影</title>
    <meta name="description" content="一个简洁的视觉生成工坊：写下提示词，挑选模型，把你的想象渲染成像素。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <script>
      // 防 FOUC：在样式应用前同步设定 data-theme
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand" aria-label="st imagen home">
        <span class="brand-mark">⌬</span>
        <span class="brand-text">
          <span class="brand-name">st<b>·</b>imagen</span>
          <span class="brand-tag">Visual studio</span>
        </span>
      </a>
      <nav class="topbar-nav">
        <button id="authEntryBtn" class="topbar-link" type="button">登录</button>
        <span id="userBadge" class="topbar-link is-hidden"></span>
        <span id="quotaBadge" class="topbar-link topbar-status quota-badge is-hidden"></span>
        <button id="userLogoutBtn" class="topbar-link is-hidden" type="button">退出</button>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" /><path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" /><path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </button>
      </nav>
    </header>

    <main class="shell">
      <!-- Hero -->
      <section class="hero">
        <p class="eyebrow">Studio · 创作工坊</p>
        <h1 class="hero-title">
          让想象，<em>显影</em>。
        </h1>
        <p class="hero-sub">
          写下一句提示词，挑选一种模型与画幅，让画面自己浮现。
        </p>
      </section>

      <!-- Composer -->
      <section class="composer" aria-label="image composer">
        <div class="composer-tabs" id="modeTabs" role="tablist">
          <button type="button" class="composer-tab active" data-mode="text2img" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7V5h16v2" />
              <path d="M9 20h6" />
              <path d="M12 5v15" />
            </svg>
            文生图
          </button>
          <button type="button" class="composer-tab" data-mode="img2img" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="9" cy="9" r="1.6" />
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
            </svg>
            图生图
          </button>
        </div>

        <div class="composer-input">
          <label for="prompt" class="visually-hidden">提示词</label>
          <textarea
            id="prompt"
            placeholder="例：一只达芬奇风格的解剖君主斑蝶，温暖的米色背景，柔和侧光。"
            spellcheck="false"
          ></textarea>
          <button
            id="promptClearBtn"
            type="button"
            class="prompt-clear-btn is-hidden"
            aria-label="清空提示词"
            title="清空提示词"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
          <div class="composer-meta">
            <span class="composer-hint">
              按 <kbd>⌘</kbd> + <kbd>↵</kbd> 生成
            </span>
            <span><span id="promptCount">0</span> 字</span>
          </div>
        </div>

        <div class="controls">
          <div class="control" id="modelControl">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.4 4.2a3 3 0 0 1-1.9 1.9L4.5 10.5l4.2 1.4a3 3 0 0 1 1.9 1.9L12 18l1.4-4.2a3 3 0 0 1 1.9-1.9l4.2-1.4-4.2-1.4a3 3 0 0 1-1.9-1.9z" />
            </svg>
            <span class="control-label">模型</span>
            <select id="model" aria-label="模型"></select>
          </div>

          <div
            class="control control-upload is-hidden"
            id="img2imgUploadRow"
            role="button"
            tabindex="0"
            aria-label="上传参考图"
          >
            <input id="referenceImageFile" class="visually-hidden" type="file" accept="image/*" multiple />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4" />
              <path d="m7 9 5-5 5 5" />
              <path d="M5 19h14" />
            </svg>
            <span class="control-label">上传参考图</span>
            <span id="referenceUploadStatus" class="upload-status" aria-live="polite"></span>
          </div>

          <div class="control control-wide is-hidden" id="img2imgRow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
            <span class="control-label">参考图 URL</span>
            <input id="imageUrl" type="text" placeholder="https://example.com/ref-1.jpg, https://example.com/ref-2.jpg（逗号分隔）" />
          </div>

          <div id="text2imgExtras" class="subrow">
            <div class="control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="6" width="18" height="12" rx="2" />
                <path d="M3 12h18" />
              </svg>
              <span class="control-label" id="aspectRatioLabel">画幅</span>
              <select id="aspectRatio" aria-label="宽高比"></select>
            </div>

            <div class="control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="14" rx="2" />
                <path d="M8 21h8" />
                <path d="M12 17v4" />
              </svg>
              <span class="control-label" id="resolutionLabel">清晰度</span>
              <select id="resolution" aria-label="分辨率"></select>
            </div>
          </div>

        </div>

        <div id="progressBox" class="progress is-hidden" aria-live="polite">
          <div class="progress-meta">
            <span class="progress-meta-left">
              <span class="progress-pulse" aria-hidden="true"></span>
              <span id="progressLabel">准备中…</span>
            </span>
            <span id="progressTimer" class="muted mono"></span>
          </div>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        </div>

        <div class="composer-actions">
          <div class="composer-actions-left">
            <div id="referenceThumbs" class="reference-thumbs is-hidden" aria-live="polite"></div>
            <p id="errorBox" class="alert is-hidden" role="alert"></p>
            <span id="genHint" class="muted"></span>
          </div>
          <button id="generateBtn" type="button" class="generate-btn">
            <span id="genLabel">开始生成</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </div>
      </section>

      <!-- Results -->
      <section id="resultsSection" class="results">
        <div class="results-head">
          <div>
            <p class="eyebrow">Output · 输出</p>
            <h2>最近的画面</h2>
          </div>
          <span id="resultMeta" class="muted mono"></span>
        </div>
        <div id="results" class="gallery"></div>
        <div id="emptyHint" class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="9" cy="9" r="1.5" />
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
          </svg>
          <p>这里会显示你的生成结果。</p>
          <span>在上方写下提示词开始你的第一张画面。</span>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-brand">st·imagen</span>
      <span>图像创作的简洁起点</span>
    </footer>

    <div class="modal-mask" id="authModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <aside class="auth-modal-aside" aria-hidden="true">
          <div class="auth-modal-aside-top">
            <div class="auth-modal-brand-row">
              <span class="brand-mark auth-modal-mark">⌬</span>
              <span class="auth-modal-brand">st·imagen</span>
            </div>
            <h3 class="auth-modal-display">
              <span class="auth-modal-display-lead">即刻，</span>
              <span class="auth-modal-display-main">开始创作</span>
            </h3>
          </div>
          <div class="auth-modal-meta">
            <div class="auth-modal-meta-item">
              <span class="auth-modal-meta-label">已有账号</span>
              <strong class="auth-modal-meta-value">账号登录</strong>
            </div>
            <div class="auth-modal-meta-item">
              <span class="auth-modal-meta-label">访客入口</span>
              <strong class="auth-modal-meta-value">访客直登</strong>
            </div>
          </div>
        </aside>

        <section class="auth-modal-main">
          <div class="auth-modal-head">
            <div class="auth-modal-title-wrap">
              <p id="authModeCaption" class="auth-modal-caption">已有账号使用用户名和密码登录</p>
              <h3 id="authModalTitle">账号登录</h3>
            </div>
            <button class="auth-modal-close" id="authModalClose" type="button" aria-label="关闭">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>

          <section id="authGate" class="auth-gate" aria-label="user access">
            <div class="auth-tabs" id="authTabs" role="tablist">
              <button type="button" class="auth-tab active" data-auth-mode="login" role="tab" aria-selected="true">已有账号登录</button>
              <button type="button" class="auth-tab" data-auth-mode="activate" role="tab" aria-selected="false">访客直登</button>
            </div>

            <div id="authLoginPane" class="auth-pane">
              <div class="auth-fields">
                <div class="auth-field">
                  <label for="authLoginUsername">用户名</label>
                  <input id="authLoginUsername" type="text" autocomplete="username" placeholder="请输入用户名" />
                </div>
                <div class="auth-field">
                  <label for="authLoginPassword">密码</label>
                  <input id="authLoginPassword" type="password" autocomplete="current-password" placeholder="请输入密码" />
                </div>
              </div>
              <div class="auth-actions">
                <button id="authLoginBtn" type="button" class="btn btn-primary btn-block auth-submit-btn">登录</button>
              </div>
            </div>

            <div id="authActivatePane" class="auth-pane is-hidden">
              <div class="auth-fields auth-fields-single">
                <div class="auth-field">
                  <label for="authInviteCode">访客码</label>
                  <input id="authInviteCode" type="text" autocomplete="off" placeholder="sti_..." />
                </div>
              </div>
              <div class="auth-actions">
                <button id="authActivateBtn" type="button" class="btn btn-primary btn-block auth-submit-btn">进入创作</button>
              </div>
            </div>

            <p id="authErrorBox" class="modal-error auth-error-box is-hidden" role="alert"></p>
          </section>
        </section>
      </div>
    </div>

    <div class="modal-mask" id="previewModal" aria-hidden="true">
      <div class="preview-modal" role="dialog" aria-modal="true" aria-label="图片预览">
        <section class="preview-stage" aria-label="图片全屏预览">
          <figure class="preview-figure">
            <img id="previewImage" src="" alt="" loading="eager" />
            <div id="previewEmptyState" class="preview-stage-empty is-hidden">图片已被清理或丢失</div>
          </figure>
          <div class="preview-overlay" aria-label="预览切换控件">
            <span id="previewCounter" class="preview-counter mono"></span>
            <span class="preview-overlay-divider" aria-hidden="true"></span>
            <button class="preview-nav preview-nav-prev" id="previewPrevBtn" type="button" aria-label="上一张">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <button class="preview-nav preview-nav-next" id="previewNextBtn" type="button" aria-label="下一张">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 6 6 6-6 6" />
              </svg>
            </button>
          </div>
        </section>

        <aside class="preview-sidebar">
          <div class="preview-sidebar-top">
            <div class="preview-sidebar-intro">
              <span class="preview-sidebar-kicker">Preview · 预览</span>
              <h3 class="preview-sidebar-title">创作详情</h3>
            </div>
            <button class="preview-close" id="previewModalClose" type="button" aria-label="关闭预览">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>

          <div class="preview-chip-row">
            <span id="previewModeChip" class="preview-chip"></span>
            <span id="previewModelChip" class="preview-chip"></span>
            <span id="previewResolutionChip" class="preview-chip"></span>
            <span id="previewAspectChip" class="preview-chip"></span>
          </div>

          <div class="preview-panel">
            <div class="preview-panel-head">
              <div class="preview-panel-title">
                <span class="preview-label">提示词</span>
              </div>
              <button id="previewCopyBtn" class="preview-copy-btn" type="button" aria-label="复制提示词">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="11" height="11" rx="2" />
                  <path d="M5 15V6a2 2 0 0 1 2-2h9" />
                </svg>
                <span id="previewCopyBtnText">复制提示词</span>
              </button>
            </div>
            <div class="preview-prompt-scroll">
              <p id="previewPrompt" class="preview-prompt"></p>
            </div>
          </div>

          <div class="preview-footer">
            <div class="preview-footer-item">
              <span class="preview-footer-label">响应</span>
              <span id="previewResponseTime" class="mono"></span>
            </div>
            <div class="preview-footer-item preview-footer-item-end">
              <span class="preview-footer-label">时间</span>
              <span id="previewTimestamp" class="preview-footer-time mono"></span>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script src="/static/common.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
