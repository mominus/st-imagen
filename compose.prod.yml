# st-imagen 生产部署编排（2c2g / 200Mbps 单机）：
#   docker compose -f compose.prod.yml up -d --build
#
# 结构：nginx 前置（直出 /uploads 与 /static + gzip + SSE 透传）→ app 单 worker。
# 注意：app 的流量守卫（限流/熔断）是进程内状态，务必保持 UVICORN_WORKERS=1。
# 域名/HTTPS 请在 nginx 配置（deploy/nginx.conf）或云 LB 上自行追加。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: st-imagen-app
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      DEBUG: "false"
      UVICORN_WORKERS: "1"
      GENERATION_GLOBAL_MAX_CONCURRENT: "90"
      ACCOUNT_MAX_INFLIGHT: "2"
      HTTP_MAX_CONNECTIONS: "128"
      HTTP_MAX_KEEPALIVE: "128"
      GENERATED_IMAGE_DOWNLOAD_CONCURRENCY: "32"
      GENERATED_IMAGE_MIN_FREE_BYTES: "8589934592"
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "0"
      DB_POOL_TIMEOUT_SECONDS: "3"
      # 可选：如果宿主机只能经本机代理访问上游，启动时设置
      # VPS_HTTP_PROXY/VPS_HTTPS_PROXY；未设置时保持直连。
      HTTP_PROXY: "${VPS_HTTP_PROXY:-}"
      HTTPS_PROXY: "${VPS_HTTPS_PROXY:-}"
      NO_PROXY: "${VPS_NO_PROXY:-localhost,127.0.0.1,::1}"
      http_proxy: "${VPS_HTTP_PROXY:-}"
      https_proxy: "${VPS_HTTPS_PROXY:-}"
      no_proxy: "${VPS_NO_PROXY:-localhost,127.0.0.1,::1}"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.6
    mem_limit: 1400m
    memswap_limit: 1400m
    pids_limit: 512
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: st-imagen-nginx
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/uploads:/srv/uploads:ro
      - ./app/static:/srv/static:ro
    ports:
      - "80:80"
    cpus: 0.4
    mem_limit: 300m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      app:
        condition: service_healthy
