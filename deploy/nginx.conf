# st-imagen 生产前置代理（2c2g 单机）：
# - /uploads 与 /static 由 nginx 直出文件（sendfile），绕开 Python 进程，省 CPU/带宽
# - SSE 流式接口关闭缓冲、拉长读超时
# - 文本响应启用 gzip；API 与页面不缓存
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    server_tokens off;

    # 与 app 的上传上限对齐（REFERENCE_UPLOAD_MAX_BYTES=20MB + 表单开销）
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    upstream st_imagen_app {
        server app:8001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 生成图/参考图：文件名唯一不可变 → 长缓存 immutable
        location /uploads/ {
            alias /srv/uploads/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 前端静态资源：文件名无指纹 → 每次重新校验（ETag/304），部署后必定拿到新文件
        location /static/ {
            alias /srv/static/;
            add_header Cache-Control "no-cache";
            access_log off;
        }

        # SSE 流式生图：禁缓冲、长超时、HTTP/1.1 长连接
        location /api/generate/stream {
            proxy_pass http://st_imagen_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 360s;
            proxy_send_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其余 API 与页面（/、/admin、/health）
        location / {
            proxy_pass http://st_imagen_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
